networks:
  data-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  # 1. Relational Metadata & Feature Store (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: feature_store
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d feature_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local S3-Compatible Object Store (Elestio MinIO Mirror)
  minio:
    image: elestio/minio:latest
    container_name: de_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Data Ingestion Microservice (Python ETL)
  ingestion:
    build:
      context: ./services/ingestion
    container_name: de_ingestion
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - data-net

  # 4. Batch Processing Engine (Apache Spark / PySpark)
  spark-processor:
    build:
      context: ./services/spark_processor
    container_name: de_spark_processor
    depends_on:
      ingestion:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - data-net

  # 5. Feature Delivery REST API (FastAPI)
  api:
    build:
      context: ./services/api
    container_name: de_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      spark-processor:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
